<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebEdit AI Side Panel</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="webedit-chat-panel">
    <!-- Header Navigation Bar -->
    <div class="webedit-panel-header">
      <button class="webedit-header-hamburger" id="webedit-header-hamburger" type="button" aria-label="Open chat history">☰</button>
      <!--<button class="webedit-nav-btn logo-btn" id="webedit-home-btn" type="button">WebEdit AI</button>-->
      <button class="webedit-nav-btn history-btn" id="webedit-edit-history-btn" type="button">EditHistory</button>
      <button class="webedit-nav-btn back-btn hidden" id="webedit-back-to-edit-btn" type="button">Back to Edit</button>
      <button class="webedit-nav-btn signin-btn" id="webedit-signin-btn" type="button">Log in</button>
      <!-- Resize and Close buttons are not needed in Side Panel as it's managed by Chrome -->
    </div>

    <div class="webedit-auth-guard hidden" id="webedit-auth-guard" aria-live="polite">
      <div class="webedit-auth-guard-card">
        <h3 id="webedit-auth-guard-title">Log in to use WebEdit AI</h3>
        <p id="webedit-auth-guard-message"></p>
        <button class="webedit-auth-guard-btn" id="webedit-auth-guard-signin">Log in</button>
      </div>
    </div>

    <!-- History Sidebar -->
    <div class="webedit-history-sidebar" id="webedit-history-sidebar">
      <div class="webedit-history-header">
        <span>Chat History</span>
        <button class="webedit-new-chat-btn" id="webedit-new-chat-btn">New Chat</button>
      </div>
      <div class="webedit-history-list" id="webedit-history-list"></div>
    </div>

    <!-- Main Content Area -->
    <div class="webedit-main-content" id="webedit-main-content">
      <div id="webedit-blueprint-list" class="webedit-blueprint-list"></div>
      <div class="webedit-chat-messages" id="webedit-chat-messages">
        <div class="webedit-chat-placeholder">
          <p>Describe what you want to change to get started</p>
        </div>
      </div>
      <div class="webedit-edit-history-view hidden" id="webedit-edit-history-view"></div>
    </div>

    <div class="webedit-bottom-controls" id="webedit-bottom-controls">
      <div class="webedit-feature-controls" aria-label="Feature buttons">
        <button class="webedit-feature-btn active" id="webedit-remove-btn" data-tool="remove" type="button">Remove</button>
        <button class="webedit-feature-btn" id="webedit-customize-btn" data-tool="customize" type="button">Customize</button>
        <button class="webedit-feature-btn" id="webedit-add-btn" data-tool="add" type="button">Add</button>
      </div>
    </div>

    <!-- Chat Input Bar (at bottom) -->
    <div class="webedit-input-container" id="webedit-input-container">
      <div class="webedit-attachment-preview" id="webedit-attachment-preview"></div>
      <div class="webedit-input-row">
        <button class="webedit-attach-btn" id="webedit-attach-btn" type="button" aria-label="Attach files">📎</button>
        <textarea 
          class="webedit-chat-input" 
          id="webedit-chat-input" 
          placeholder="What to do you want to change?"
          rows="2"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button class="webedit-send-btn" id="webedit-send-btn" type="button" aria-label="Send message">➤</button>
      </div>
      <input class="webedit-file-input" id="webedit-file-input" type="file" multiple accept="image/*,.pdf,.doc,.docx,.txt,.json,.csv,.md" />
    </div>
  </div>
  <script src="sidepanel.js"></script>
  <script src="features/remove-panel.js"></script>
  <script src="features/customize-panel.js"></script>
  <script src="features/add-panel.js"></script>
</body>
</html>
