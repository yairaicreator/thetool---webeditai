<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebEdit AI Side Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div id="webedit-chat-panel">
    <!-- Header Navigation Bar -->
    <div class="webedit-panel-header">
      <button class="webedit-header-hamburger" id="webedit-header-hamburger" type="button" aria-label="Open chat history">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="webedit-nav-btn logo-btn" id="webedit-home-btn" type="button">WebEdit AI</button>
      <button class="webedit-nav-btn signin-btn" id="webedit-signin-btn" type="button">Log in</button>
    </div>

    <div class="webedit-auth-guard hidden" id="webedit-auth-guard" aria-live="polite">
      <div class="webedit-auth-guard-card">
        <h3 id="webedit-auth-guard-title">Log in to use WebEdit AI</h3>
        <p id="webedit-auth-guard-message"></p>
        <button class="webedit-auth-guard-btn" id="webedit-auth-guard-signin">Log in</button>
      </div>
    </div>

    <!-- History Sidebar (Chat History + nav) -->
    <div class="webedit-history-sidebar" id="webedit-history-sidebar">
      <div class="webedit-history-profile-card hidden" id="webedit-history-profile-card">
        <div class="webedit-history-profile-avatar" id="webedit-history-profile-avatar" aria-hidden="true">U</div>
        <div class="webedit-history-profile-text">
          <div class="webedit-history-profile-name" id="webedit-history-profile-name"></div>
          <div class="webedit-history-profile-sub" id="webedit-history-profile-sub">The Digital Editor</div>
        </div>
      </div>
      <button class="webedit-new-chat-btn webedit-sidebar-new-chat-primary" id="webedit-new-chat-btn" type="button">
        <span class="webedit-sidebar-new-chat-icon" aria-hidden="true">+</span>
        New Chat
      </button>
      <nav class="webedit-history-sidebar-nav" aria-label="Chat history menu">
        <button type="button" class="webedit-sidebar-nav-item" id="webedit-sidebar-nav-new-chat" data-sidebar-action="new-chat">
          <span class="webedit-sidebar-nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></span>
          <span class="webedit-sidebar-nav-label">New Chat</span>
        </button>
        <button type="button" class="webedit-sidebar-nav-item" id="webedit-sidebar-nav-recent-edits" data-sidebar-action="recent-edits">
          <span class="webedit-sidebar-nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>
          <span class="webedit-sidebar-nav-label">Recent Edits</span>
        </button>
        <button type="button" class="webedit-sidebar-nav-item" id="webedit-sidebar-nav-settings" data-sidebar-action="settings">
          <span class="webedit-sidebar-nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></svg></span>
          <span class="webedit-sidebar-nav-label">Settings</span>
        </button>
      </nav>
      <div class="webedit-history-header">
        <span>Chats</span>
      </div>
      <div class="webedit-history-list" id="webedit-history-list"></div>
    </div>

    <!-- Main Content Area -->
    <div class="webedit-main-content" id="webedit-main-content">
      <div id="webedit-blueprint-list" class="webedit-blueprint-list"></div>
      <div class="webedit-chat-messages" id="webedit-chat-messages">
        <div class="webedit-chat-home" id="webedit-chat-home" hidden>
          <div class="webedit-chat-empty-prompt">
            <p class="webedit-chat-empty-prompt-title">Start customizing this page</p>
            <p class="webedit-chat-empty-prompt-text">Pick <strong>Remove</strong>, <strong>Customize</strong>, or <strong>Add</strong> below, then tell the AI what to change—or open the menu for your chat history and recent edits.</p>
          </div>
        </div>
        <div class="webedit-chat-thread" id="webedit-chat-thread"></div>
      </div>
      <div class="webedit-edit-history-view hidden" id="webedit-edit-history-view"></div>
    </div>

    <div class="webedit-bottom-controls" id="webedit-bottom-controls">
      <div class="webedit-page-edits-row hidden" id="webedit-page-edits-row" aria-label="Edits on this page"></div>
      <div class="webedit-feature-controls" aria-label="Feature buttons">
        <button class="webedit-feature-btn active" id="webedit-remove-btn" data-tool="remove" type="button">
          <svg class="webedit-feature-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>
          <span>Remove</span>
        </button>
        <button class="webedit-feature-btn" id="webedit-customize-btn" data-tool="customize" type="button">
          <svg class="webedit-feature-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>Customize</span>
        </button>
        <button class="webedit-feature-btn" id="webedit-add-btn" data-tool="add" type="button">
          <svg class="webedit-feature-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Add</span>
        </button>
      </div>
    </div>

    <!-- Chat Input Bar -->
    <div class="webedit-input-container" id="webedit-input-container">
      <div class="webedit-input-row">
        <textarea 
          class="webedit-chat-input" 
          id="webedit-chat-input" 
          placeholder="Ask AI to edit this page…"
          rows="2"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button class="webedit-send-btn" id="webedit-send-btn" type="button" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>

    <nav class="webedit-bottom-nav" id="webedit-bottom-nav" aria-label="Primary navigation">
      <button type="button" class="webedit-bottom-nav-btn active" id="webedit-nav-chat" data-nav="chat" aria-current="page">
        <svg class="webedit-bottom-nav-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="webedit-bottom-nav-label">Chat</span>
      </button>
      <button type="button" class="webedit-bottom-nav-btn" id="webedit-nav-history" data-nav="history">
        <svg class="webedit-bottom-nav-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        <span class="webedit-bottom-nav-label">History</span>
      </button>
      <button type="button" class="webedit-bottom-nav-btn" id="webedit-nav-browse" data-nav="browse">
        <svg class="webedit-bottom-nav-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span class="webedit-bottom-nav-label">Browse</span>
      </button>
    </nav>
  </div>
  <script src="elementLabels.js"></script>
  <script src="sidepanel.js"></script>
  <script src="features/remove-panel.js"></script>
  <script src="features/customize-panel.js"></script>
  <script src="features/add-panel.js"></script>
</body>
</html>
