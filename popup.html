<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WebEdit AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #d7fbff 0%, #f0f9ff 100%);
    }

    .popup-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, #3b82f6, #ec4899);
      color: white;
      font-weight: 600;
      font-size: 16px;
    }

    .logo-web,
    .logo-edit {
      font-weight: 700;
    }

    .logo-ai {
      font-weight: 500;
    }

    .description {
      text-align: center;
      font-size: 13px;
      color: #374151;
      line-height: 1.5;
    }

    .toggle-btn {
      width: 100%;
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, #f97316, #6366f1);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .toggle-btn:hover {
      transform: scale(1.05);
    }

    .toggle-btn:active {
      transform: scale(0.98);
    }

    .status {
      font-size: 11px;
      color: #6b7280;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto;
      background: linear-gradient(135deg, #3b82f6, #ec4899);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="icon">✨</div>
    
    <div class="logo">
      <span class="logo-web">Web</span><span class="logo-edit">Edit</span>
      <span class="logo-ai"> AI</span>
    </div>

    <p class="description">
      Visual editor for any website. Hide, customize, or add elements with AI assistance.
    </p>

    <button class="toggle-btn" id="toggleBtn">
      Open WebEdit AI Panel
    </button>

    <p class="status" id="status">Click to open the AI chat panel</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
